# Lead-demo default: cheapest viable static ship
# Set in dashboard/MCP: sleepApplication=true, limits vCPUs=0.25 memoryGB=0.25, 1 replica
[build]
builder = "RAILPACK"
buildCommand = "npm run build"

[deploy]
startCommand = "npm start"
# Serverless + replica limits are set via Railway service config (update-service),
# not railway.toml — apply on every weekday lead demo.
